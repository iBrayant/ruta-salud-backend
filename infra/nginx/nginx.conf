worker_processes auto;
events { worker_connections 1024; }

http {
    server_tokens off;
    client_max_body_size 64k;
    client_body_timeout 15s;
    keepalive_timeout 30s;

    # IP real: detrás de Cloudflare Tunnel llega en CF-Connecting-IP
    map $http_cf_connecting_ip $ip_real { "" $remote_addr; default $http_cf_connecting_ip; }

    log_format json escape=json '{"ts":"$time_iso8601","ip":"$ip_real","metodo":"$request_method",'
                                '"uri":"$uri","estado":$status,"bytes":$body_bytes_sent,"ms":$request_time,'
                                '"upstream":"$upstream_addr","ua":"$http_user_agent"}';
    access_log /dev/stdout json;
    error_log /dev/stderr warn;

    # Límite de peticiones (mitiga fuerza bruta y abuso de la IA de pago)
    limit_req_zone $ip_real zone=api:10m   rate=10r/s;
    limit_req_zone $ip_real zone=token:10m rate=3r/s;
    limit_req_zone $ip_real zone=ia:10m    rate=12r/m;
    limit_req_status 429;

    upstream rutas     { server rutas:8000; }
    upstream auditoria { server auditoria:8000; }
    upstream ia        { server ia:8000; }
    upstream keycloak  { server keycloak:8080; }

    server {
        listen 80;

        set $csp_api "default-src 'none'; frame-ancestors 'none'";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
        add_header Strict-Transport-Security "max-age=31536000" always;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $ip_real;
        proxy_set_header X-Forwarded-For   $ip_real;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_read_timeout 90s;

        location = /health { default_type application/json; return 200 '{"gateway":"ok"}'; }

        # ---------------- Endpoints internos: nunca expuestos al exterior
        location = /api/ia/explicar { return 404; }
        location = /api/auditoria/eventos {
            limit_except GET { deny all; }       # POST solo servicio a servicio, dentro de la red Docker
            limit_req zone=api burst=20 nodelay;
            add_header Content-Security-Policy $csp_api always;
            proxy_pass http://auditoria;
        }

        # ---------------- Documentación OpenAPI (Swagger necesita su CDN)
        location ~ ^/api/(rutas|auditoria|ia)/(docs|openapi\.json)$ {
            add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; img-src 'self' data: https://fastapi.tiangolo.com" always;
            proxy_pass http://$1;
        }

        # ---------------- APIs
        location /api/auditoria/ {
            limit_req zone=api burst=20 nodelay;
            add_header Content-Security-Policy $csp_api always;
            proxy_pass http://auditoria;
        }
        location = /api/ia/consultas {
            limit_req zone=ia burst=5 nodelay;
            add_header Content-Security-Policy $csp_api always;
            proxy_pass http://ia;
        }
        location /api/ia/ { return 404; }
        location ~ ^/api/(rutas|veredas) {
            limit_req zone=api burst=20 nodelay;
            add_header Content-Security-Policy $csp_api always;
            proxy_pass http://rutas;
        }

        # ---------------- Keycloak (OAuth 2.0 / OIDC)
        location ~ ^/auth/realms/[^/]+/protocol/openid-connect/token$ {
            limit_req zone=token burst=10 nodelay;
            proxy_pass http://keycloak;
        }
        location /auth/admin/ {
            # Consola de administración: solo acceso local, nunca a través del túnel
            if ($http_cf_connecting_ip != "") { return 403; }
            proxy_pass http://keycloak;
        }
        location /auth/ {
            proxy_buffer_size 128k;
            proxy_buffers 4 256k;
            proxy_pass http://keycloak;
        }

        location / { return 404; }
    }
}
