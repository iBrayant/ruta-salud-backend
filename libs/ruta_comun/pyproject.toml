[project]
name = "ruta-comun"
version = "1.0.0"
description = "Utilidades compartidas: seguridad OAuth 2.0 (Keycloak), cliente de auditoría y logs"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.115.6",
  "httpx==0.28.1",
  "PyJWT[crypto]==2.10.1",
  "pydantic==2.10.4",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ruta_comun*"]
